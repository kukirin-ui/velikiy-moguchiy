name: Release

# A v* tag (for example v0.1.0) builds the Mac app and the unsigned IPA through
# build-apple.yml, the Android APKs through build-android.yml and the Windows app
# through build-windows.yml, and creates a DRAFT GitHub release with the files,
# their SHA-256 checksums and the Russian release notes from .github/release-notes.md.
# Nothing is published until the draft is published by hand on the Releases
# page. Tags are made by the owner; this workflow never creates one.
#
# Before anything is built, the privacy guard runs on the tagged tree and the tagged commit must be
# authored and committed by a GitHub no-reply address. After the builds, tools/scan_artifacts.py reads
# every file in them for home folders, personal e-mails and the author's identifiers. Any finding stops
# the release before the draft exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  privacy:
    name: Privacy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Guard tests
        run: python3 -m pip install -q pytest && python3 -m pytest -q -p no:cacheprovider tools/test_privacy_guard.py tools/test_scan_artifacts.py
      - name: Tagged tree
        env:
          PRIVACY_GUARD_EXTRA: ${{ secrets.PRIVACY_GUARD_EXTRA }}
        run: python3 tools/privacy_guard.py
      - name: Release commit
        run: |
          python3 tools/privacy_guard.py --commits "${GITHUB_SHA}^!" -- tools/privacy_guard.py
          bad=$(git log -1 --format='%ae%n%ce' "$GITHUB_SHA" \
                | grep -vE '^([0-9]+\+)?[A-Za-z0-9-]+@users\.noreply\.github\.com$|^noreply@github\.com$' || true)
          if [ -n "$bad" ]; then
            echo "::error::The release commit must have a GitHub no-reply address as author and committer"
            exit 1
          fi

  build:
    name: Build
    needs: privacy
    uses: ./.github/workflows/build-apple.yml
    with:
      mac: true
      ios: true

  android:
    name: Android
    needs: privacy
    uses: ./.github/workflows/build-android.yml
    # The release APK is signed with the ANDROID_* secrets when they exist.
    secrets: inherit

  windows:
    name: Build Windows
    needs: privacy
    uses: ./.github/workflows/build-windows.yml

  draft:
    name: Draft release
    needs: [privacy, build, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Privacy scan of the builds
        env:
          PRIVACY_GUARD_EXTRA: ${{ secrets.PRIVACY_GUARD_EXTRA }}
        run: python3 tools/scan_artifacts.py dist/VelikiyMoguchiy-macOS-arm64.zip dist/VelikiyMoguchiy-iOS-unsigned.ipa dist/VelikiyMoguchiy-Android*.apk dist/VelikiyMoguchiy-Windows-x64.zip

      - name: Checksums and release notes
        run: |
          set -euo pipefail
          cd dist
          test -f VelikiyMoguchiy-macOS-arm64.zip
          test -f VelikiyMoguchiy-iOS-unsigned.ipa
          test -f VelikiyMoguchiy-Android-debug.apk
          test -f VelikiyMoguchiy-Windows-x64.zip
          sha256sum VelikiyMoguchiy-macOS-arm64.zip VelikiyMoguchiy-iOS-unsigned.ipa VelikiyMoguchiy-Android*.apk VelikiyMoguchiy-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FILES=(dist/VelikiyMoguchiy-macOS-arm64.zip dist/VelikiyMoguchiy-iOS-unsigned.ipa dist/VelikiyMoguchiy-Android*.apk dist/VelikiyMoguchiy-Windows-x64.zip dist/SHA256SUMS.txt)
          TITLE="«Великий & Могучий» ${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run: refresh the files and notes, keep whatever state the release is in.
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            PRERELEASE=()
            case "$TAG" in *-*) PRERELEASE=(--prerelease) ;; esac
            gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              "${PRERELEASE[@]}" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "Draft ready: https://github.com/${GITHUB_REPOSITORY}/releases (publish it by hand)"
