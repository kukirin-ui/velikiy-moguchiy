name: Build Apple apps

# Builds the macOS app (Rust core + XcodeGen + xcodebuild, ad-hoc signed, zipped)
# and the unsigned iOS IPA, and uploads both as artifacts.
#
# macOS runner minutes are scarce, so this never runs on ordinary pushes:
#   - pull request: add the label "build" (remove and add it again to rebuild);
#   - tags: mac-v* builds only the Mac app, ios-v* only the IPA;
#     v* tags build both through release.yml, which calls this workflow,
#     so a release tag is built once, not twice; a tag build takes its
#     version from the tag;
#   - manually: Actions > Build Apple apps > Run workflow.

on:
  workflow_dispatch:
    inputs:
      mac:
        description: Build the macOS app
        type: boolean
        default: true
      ios:
        description: Build the iOS IPA
        type: boolean
        default: true
  workflow_call:
    inputs:
      mac:
        type: boolean
        default: true
      ios:
        type: boolean
        default: true
  push:
    tags: ["mac-v*", "ios-v*"]
  pull_request:
    types: [labeled]

concurrency:
  # One build per PR or ref: adding "build" again cancels the older build. Other
  # labels get their own group, so labelling a PR never cancels a running build.
  # A call from release.yml runs under the caller's workflow name.
  group: build-apple-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  mac:
    name: macOS app
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'build') ||
      (github.event_name == 'push' && !startsWith(github.ref_name, 'ios-v')) ||
      (github.event_name != 'pull_request' && github.event_name != 'push' && inputs.mac)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac
          key: aarch64-apple-darwin-release

      - name: Install XcodeGen and cmake
        run: brew install xcodegen cmake

      - name: Version from the tag
        # v0.1.0, mac-v0.1.0 -> CFBundleShortVersionString 0.1.0 (a -suffix is dropped)
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#mac-}"; VERSION="${VERSION#v}"; VERSION="${VERSION%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" MacApp/VelikiyMoguchiy/Info.plist
          echo "Mac app version $VERSION"

      - name: Build CLI
        run: cargo build --package velikiy-moguchiy-cli --release --target aarch64-apple-darwin

      - name: Build mic-warm
        run: swift build -c release --package-path vendor/mic-warm

      - name: Generate Xcode project
        working-directory: mac/MacApp
        run: xcodegen generate --spec project.yml

      - name: Build app
        # The pre-build script of the target builds the Rust core (static library).
        # The app is signed ad hoc by package-app.sh after the CLI and mic-warm
        # are embedded, so Xcode does not sign here.
        working-directory: mac/MacApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project VelikiyMoguchiy.xcodeproj \
            -scheme VelikiyMoguchiy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-ci/derived \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check bundle id and bundled lips service
        # macOS keeps permissions and preferences per bundle id: the published
        # builds must all carry the permanent one from MacApp/Config/Base.xcconfig.
        run: |
          set -euo pipefail
          APP="MacApp/build-ci/derived/Build/Products/Release/VelikiyMoguchiy.app"
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist")
          echo "Bundle id: $ID"
          test "$ID" = "io.github.zigansh1n.velikiy-moguchiy"
          test -f "$APP/Contents/Resources/lipread/lips_service.py"
          test -f "$APP/Contents/Resources/lipread/uv.lock"

      - name: Logic tests
        working-directory: mac/MacApp
        run: |
          set -euo pipefail
          xcodebuild test \
            -project VelikiyMoguchiy.xcodeproj \
            -scheme VelikiyMoguchiyLogicTests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build-ci/derived-tests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          scripts/package-app.sh \
            "MacApp/build-ci/derived/Build/Products/Release/VelikiyMoguchiy.app" \
            "target/aarch64-apple-darwin/release/velikiy-moguchiy" \
            "VelikiyMoguchiy-macOS-arm64.zip" \
            "vendor/mic-warm/.build/release/mic-warm"
          ls -la VelikiyMoguchiy-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VelikiyMoguchiy-macOS-arm64
          path: mac/VelikiyMoguchiy-macOS-arm64.zip
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'build') ||
      (github.event_name == 'push' && !startsWith(github.ref_name, 'mac-v')) ||
      (github.event_name != 'pull_request' && github.event_name != 'push' && inputs.ios)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # v0.1.0, ios-v0.1.0 -> MARKETING_VERSION 0.1.0 (a -suffix is dropped)
            VERSION="${GITHUB_REF_NAME#ios-}"; VERSION="${VERSION#v}"; export MARKETING_VERSION="${VERSION%%-*}"
          fi
          Scripts/build-unsigned-ipa.sh dist/VelikiyMoguchiy-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VelikiyMoguchiy-iOS-unsigned
          path: ios/dist/VelikiyMoguchiy-iOS-unsigned.ipa
          if-no-files-found: error
