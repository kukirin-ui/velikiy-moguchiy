name: Statistics page

# Rewrites docs/STATS.md daily (tools/stats/stats.py) and commits it only when
# a number changed. main is protected by a ruleset that GitHub Actions cannot
# bypass in a personal repository, so the push uses the BOT_PUSH_KEY deploy key,
# which the ruleset lets through (docs/AUTOMATION.md). In pull requests the
# page is only printed.

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - tools/stats/**
      - .github/workflows/stats.yml

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update docs/STATS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.BOT_PUSH_KEY || '' }}

      - name: Self-test
        run: python3 tools/stats/stats.py selftest

      - name: Preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/stats/stats.py --print

      - name: Update and commit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/stats/stats.py
          if git diff --quiet -- docs/STATS.md && ! git ls-files --others --exclude-standard -- docs/STATS.md | grep -q .; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATS.md
          git commit -m "Update the statistics page"
          git push
