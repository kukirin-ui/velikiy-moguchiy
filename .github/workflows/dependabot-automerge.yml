name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's patch and minor updates. GitHub merges
# the PR only after every check required by the main ruleset is green
# (.github/rulesets/main.json); a failing check leaves the PR open for a person.
# Major updates are never merged automatically.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'zigansh1n/velikiy-moguchiy'
    runs-on: ubuntu-latest
    steps:
      - name: Update metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge (squash)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Major update
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: echo "Major update of $DEPS, auto-merge stays off until a maintainer reviews it."
