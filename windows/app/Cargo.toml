[package]
name = "velikiy-moguchiy-windows"
description = "«Великий & Могучий» for Windows: dictation into any app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "VelikiyMoguchiy"
path = "src/main.rs"

[features]
default = []
# Local recognition without a key (CPU). Downloads prebuilt sherpa-onnx
# libraries at build time. They include espeak-ng (GPL-3.0) for speech
# synthesis, which ends up in the executable, so a build with this feature
# cannot be distributed under MIT alone; release builds leave it off.
sherpa-onnx = ["velikiy-moguchiy-core/sherpa-onnx"]

[dependencies]
base64 = "0.22"
log.workspace = true
serde_json = "1"
velikiy-moguchiy-core = { path = "../../mac/velikiy-moguchiy-core", default-features = false }

[target.'cfg(windows)'.dependencies]
velikiy-moguchiy-win32 = { path = "../win32" }

[build-dependencies]
embed-resource = "3"
png = "0.18"
