[project]
name = "lipread-ru"
version = "0.1.0"
description = "Эксперимент: беззвучное чтение по губам на русском (MultiVSR) на Apple Silicon"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Версии из requirements.txt MultiVSR (там проверено на Python 3.13.5). Только то, что нужно для инференса.
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==2.2.6",
    "einops==0.8.2",
    "linear_attention_transformer==0.19.1",
    "transformers==4.53.3",
    "tokenizers==0.21.4",
    "configargparse==1.7.7",
    "opencv-python==4.12.0.88",
    "scipy==1.16.3",
    "pandas",
    "tqdm==4.67.3",
    "pillow==11.3.0",
    # ffmpeg для кадров с камеры у пользователей приложения без Homebrew (режим «губы», mac/ SPLipsRuntime).
    "imageio-ffmpeg==0.6.0",
    # «Помочь обучить» (federated/client) в том же окружении приложения: протокол, подписи, сеть, скачивание роликов.
    "cryptography==50.0.2",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "safetensors==0.8.0",
    "yt-dlp==2026.8.19",
    # Для рекордера: выбор встроенной камеры (как в Lipflow), только macOS.
    "pyobjc-framework-avfoundation>=10.3; sys_platform == 'darwin'",
]

[tool.uv]
package = false
