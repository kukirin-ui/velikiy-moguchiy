[package]
name = "velikiy-moguchiy-cli"
description = "Command-line interface for Velikiy Moguchiy speech recognition"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "velikiy-moguchiy"
path = "src/main.rs"

[dependencies]
velikiy-moguchiy-asr = { path = "../velikiy-moguchiy-asr" }
velikiy-moguchiy-core = { path = "../velikiy-moguchiy-core", default-features = false }
clap = { workspace = true, features = ["derive"] }
indicatif.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
rusqlite = "0.40"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
