name: VelikiyMoguchiy
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

# The bundle identifier comes from Config/Base.xcconfig; put your own in the
# git-ignored Config/Secrets.xcconfig (see Config/Secrets.xcconfig.example).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  AppleSpeechBridge:
    path: ../Packages/AppleSpeechBridge

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: "$(MAC_APP_BUNDLE_IDENTIFIER)"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targetTemplates:
  MacApp:
    type: application
    platform: macOS
    sources:
      - path: VelikiyMoguchiy
        excludes:
          - "*.entitlements"
          - "**/*Tests.m"
    settings:
      base:
        INFOPLIST_FILE: VelikiyMoguchiy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: VelikiyMoguchiy/VelikiyMoguchiy.entitlements
        PRODUCT_NAME: VelikiyMoguchiy
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../velikiy-moguchiy-core/target"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../target/release"
        OTHER_LDFLAGS:
          - "-lvelikiy_moguchiy_core"
          - "-lc++"
          - "-lSystem"
          - "-lresolv"
          - "-framework Security"
          - "-framework CoreFoundation"
          - "-framework UserNotifications"
          - "-framework SystemConfiguration"
        ENABLE_APP_SANDBOX: NO
        CLANG_ENABLE_OBJC_ARC: YES
    frameworks:
      - AVFoundation
      - AppKit
      - ApplicationServices
      - Carbon
      - CoreAudio
      - AudioToolbox
      - ServiceManagement
      - Speech
      - UserNotifications
      - OSLog
      - sdk: libsqlite3.tbd

targets:
  VelikiyMoguchiy:
    templates:
      - MacApp
    settings:
      base:
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: AppleSpeechBridge
        product: AppleSpeechBridge
    preBuildScripts:
      - name: Build Rust Library
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v cmake >/dev/null || { echo "error: cmake is required to build Rust dependency audiopus_sys. Install it with: brew install cmake" >&2; exit 1; }
          cd "${SRCROOT}/.."
          RUST_TARGET="aarch64-apple-darwin"
          # sherpa-onnx without text-to-speech: the default libraries link GPL espeak-ng in.
          export SHERPA_ONNX_LIB_DIR="$(scripts/sherpa-onnx-libs.sh)"
          cargo build --manifest-path velikiy-moguchiy-core/Cargo.toml --release --target "$RUST_TARGET" --no-default-features --features "apple-speech,sherpa-onnx"
          mkdir -p "${SRCROOT}/../target/release"
          ln -sf "${SRCROOT}/../target/${RUST_TARGET}/release/libvelikiy_moguchiy_core.a" "${SRCROOT}/../target/release/libvelikiy_moguchiy_core.a"
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle Lips Service Code
        # The lips mode copies this into the environment it builds on first use
        # (SPLipsRuntime), so a Mac without a lipread checkout can run it.
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/../../lipread"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/lipread"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC"/*.py "$SRC/pyproject.toml" "$SRC/uv.lock" "$SRC/multivsr_files.sha256" "$DEST/"
          # A build from a checkout remembers its lipread folder, so a developer's ready .venv is used
          # instead of the managed download (SPLipsRuntime). CI builds for users leave it out.
          rm -f "$DEST-source.txt"
          if [ -z "${CI:-}" ]; then (cd "$SRC" && pwd -P) > "$DEST-source.txt"; fi
          # «Обучить на мне» runs its steps under ../tools/mem_guard.py.
          rm -rf "$DEST-tools"
          mkdir -p "$DEST-tools"
          cp "$SRC/../tools/mem_guard.py" "$DEST-tools/"
          # «Помочь обучить»: the federated client runs in the same environment (its packages are in uv.lock).
          rm -rf "$DEST-federated"
          mkdir -p "$DEST-federated/client" "$DEST-federated/protocol/specs"
          cp "$SRC/../federated/client/"*.py "$DEST-federated/client/"
          cp "$SRC/../federated/protocol/"*.py "$DEST-federated/protocol/"
          cp "$SRC/../federated/protocol/specs/"*.json "$DEST-federated/protocol/specs/"
        basedOnDependencyAnalysis: false

  VelikiyMoguchiyLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VelikiyMoguchiy/AppDelegate/SPAppDelegateLogicTests.m
      - path: VelikiyMoguchiy/AppDelegate/SPOutputModes.m
      - path: VelikiyMoguchiy/AppDelegate/SPOutputModesTests.m
      - path: VelikiyMoguchiy/Support/SPErrorExplainer.m
      - path: VelikiyMoguchiy/Support/SPErrorExplainerTests.m
      - path: VelikiyMoguchiy/Support/SPHotkeyNames.m
      - path: VelikiyMoguchiy/Support/SPHotkeyNamesTests.m
      - path: VelikiyMoguchiy/Hotkey/SPTriggerKeyPolicy.m
      - path: VelikiyMoguchiy/Hotkey/SPTriggerKeyPolicyTests.m
      - path: VelikiyMoguchiy/Accessibility/SPAccessibilityManager.m
      - path: VelikiyMoguchiy/Accessibility/SPAccessibilityManagerTests.m
      - path: VelikiyMoguchiy/Hotkey/SPHotkeyMonitor.m
      - path: VelikiyMoguchiy/History/SPHistoryManager.m
      - path: VelikiyMoguchiy/History/SPHistoryManagerTests.m
      - path: VelikiyMoguchiy/History/SPRetranscriber.m
      - path: VelikiyMoguchiy/History/SPRetranscriberTests.m
      - path: VelikiyMoguchiy/History/SPDictationsCSV.m
      - path: VelikiyMoguchiy/History/SPDictationsCSVTests.m
      - path: VelikiyMoguchiy/Paste/SPTextEditPolicy.m
      - path: VelikiyMoguchiy/Settings/SPQwenModelChoice.m
      - path: VelikiyMoguchiy/Settings/SPQwenModelChoiceTests.m
      - path: VelikiyMoguchiy/Paste/SPTextEditPolicyTests.m
      - path: VelikiyMoguchiy/LipData/SPLipDataPolicy.m
      - path: VelikiyMoguchiy/LipData/SPLipDataPolicyTests.m
      - path: VelikiyMoguchiy/LipData/SPLipsPolicy.m
      - path: VelikiyMoguchiy/LipData/SPLipsPolicyTests.m
      - path: VelikiyMoguchiy/LipTraining/SPLipTrainingPolicy.m
      - path: VelikiyMoguchiy/LipTraining/SPLipTrainingPolicyTests.m
      - path: VelikiyMoguchiy/LipData/SPLipsRuntimePolicy.m
      - path: VelikiyMoguchiy/LipData/SPLipsRuntimePolicyTests.m
      - path: VelikiyMoguchiy/Updates/SPUpdatePolicy.m
      - path: VelikiyMoguchiy/Updates/SPUpdatePolicyTests.m
      - path: VelikiyMoguchiy/Settings/SPLocalAsrPolicy.m
      - path: VelikiyMoguchiy/Settings/SPLocalAsrPolicyTests.m
      - path: VelikiyMoguchiy/ProblemReport/SPProblemReport.m
      - path: VelikiyMoguchiy/ProblemReport/SPProblemReportTests.m
      - path: VelikiyMoguchiy/Support/SPAppPathsTests.m
      - path: VelikiyMoguchiy/CommunityTraining/SPCommunityTrainingPolicy.m
      - path: VelikiyMoguchiy/CommunityTraining/SPCommunityTrainingPolicyTests.m
      - path: VelikiyMoguchiy/Clipboard/SPClipboardManager.m
      - path: VelikiyMoguchiy/Clipboard/SPClipboardRestorePolicy.m
      - path: VelikiyMoguchiy/Clipboard/SPClipboardRestorePolicyTests.m
      - path: VelikiyMoguchiy/Clipboard/SPClipboardManagerTests.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(MAC_APP_BUNDLE_IDENTIFIER).logic-tests"
        CLANG_ENABLE_OBJC_ARC: YES
    frameworks:
      - XCTest
      - Foundation
      - AVFoundation
      - ApplicationServices
      - sdk: libsqlite3.tbd
